services:
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita-server
    restart: unless-stopped
    networks:
      - proxy_net
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./kavita_data/config:/kavita/config
      - ./kavita_data/libros:/libros
      - ./kavita_data/apuntes_facultad:/apuntes

networks:
  proxy_net:
    external: true
