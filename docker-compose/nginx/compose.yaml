services:
  nginx:
    image: nginx:stable-alpine3.24-perl
    container_name: nginx-proxy
    ports:
      - "80:80/tcp"
      - "443:443/udp"
      - "443:443/tcp"
    volumes:
      - ./conf:/etc/nginx/conf.d
      - ./certs:/etc/nginx/certs
      - ./snippets:/etc/nginx/snippets
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
