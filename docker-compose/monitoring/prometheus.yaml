global:
  scrape_interval: 30s

scrape_configs:
  - job_name: 'prometheus'
    
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'character_gallery'
    
    static_configs:
      - targets: ['character-gallery-api:8080']
  
  - job_name: 'postgres-db'
    
    static_configs:
      - targets: ['postgres-exporter:9187']
