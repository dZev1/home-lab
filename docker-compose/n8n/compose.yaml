services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-server
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=gimnasio
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}

      - N8N_ENCRYPTION_KEY=${MY_KEY}
      - WEBHOOK_URL=https://n8n.dezetin.com
      - N8N_PROTOCOL=https
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=America/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - dragored

networks:
  dragored:
    external: true

volumes:
  n8n_data:
    external: false
